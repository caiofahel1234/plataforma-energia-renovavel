# Subir tudo: ./scripts/gen-dev-cert.sh && cp .env.example .env (preencher) && docker compose up --build
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment: { POSTGRES_DB: vse, POSTGRES_USER: vse_app, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina no .env}" }
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./backend/seeds/demo.sql:/docker-entrypoint-initdb.d/002_demo.sql:ro   # dados FICTÍCIOS; remova em produção
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vse_app -d vse"], interval: 5s, timeout: 5s, retries: 10 }
    networks: [data]                       # rede interna: sem portas publicadas e sem saída para a internet
    security_opt: ["no-new-privileges:true"]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://vse_app:${POSTGRES_PASSWORD}@db:5432/vse"
      JWT_SECRET: "${JWT_SECRET:?defina no .env}"
      CORS_ORIGINS: "${CORS_ORIGINS:-https://localhost}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?defina no .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?defina no .env}"
      ENABLE_DOCS: "${ENABLE_DOCS:-true}"
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 5 }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app, data]
  web:
    build: ./frontend
    restart: unless-stopped
    ports: 
      - "${WEB_HTTP_PORT:-8080}:8080"
    depends_on: { api: { condition: service_healthy } }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, app]
networks:
  edge: {}
  app: {}
  data: { internal: true }
volumes: { dbdata: {} }
