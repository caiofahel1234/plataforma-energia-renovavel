services:
  db:
    image: postgis/postgis:16-3.4
    container_name: energia-renovavel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: energia_renovavel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energia_renovavel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: energia-renovavel-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/energia_renovavel?schema=public"
      JWT_SECRET: "chave-jwt-desenvolvimento"
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data: